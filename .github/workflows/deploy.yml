name: Deploy CELEYO
on:
  workflow_run:
    workflows: [CELEYO checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: celeyo-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.CELEYO_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Backup, migrate, deploy, configure secrets, smoke test
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CELEYO_BACKUP_KEY: ${{ secrets.CELEYO_BACKUP_KEY }}
          CELEYO_WORKER_SECRETS: ${{ secrets.CELEYO_WORKER_SECRETS }}
          CELEYO_ENV: production
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          PUBLIC_SITE_URL: https://celeyo.com
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          AI_ENABLED: ${{ vars.AI_ENABLED || 'false' }}
          AI_DAILY_BUDGET_MICRO_USD: ${{ vars.AI_DAILY_BUDGET_MICRO_USD || '100000' }}
      - name: Retain encrypted pre-deploy database backup
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celeyo-encrypted-backup-${{ github.run_id }}
          path: backups/*.enc
          retention-days: 30
          if-no-files-found: ignore
